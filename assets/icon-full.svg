<!-- The favicon's dots on a full-bleed square, for icons the platform crops
     itself: Android's maskable shapes and iOS's rounded square. The dots are
     scaled into the central safe zone so no shape cuts them off. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" fill="#000"/>
  <g transform="translate(16 16) scale(0.72) translate(-16 -16)">
    <g fill="#2e2508">
      <circle cx="5" cy="5" r="2"/><circle cx="10.5" cy="5" r="2"/><circle cx="16" cy="5" r="2"/><circle cx="27" cy="5" r="2"/>
      <circle cx="5" cy="10.5" r="2"/><circle cx="10.5" cy="10.5" r="2"/><circle cx="21.5" cy="10.5" r="2"/><circle cx="27" cy="10.5" r="2"/>
      <circle cx="5" cy="16" r="2"/><circle cx="16" cy="16" r="2"/><circle cx="21.5" cy="16" r="2"/><circle cx="27" cy="16" r="2"/>
      <circle cx="5" cy="21.5" r="2"/><circle cx="10.5" cy="21.5" r="2"/><circle cx="21.5" cy="21.5" r="2"/><circle cx="27" cy="21.5" r="2"/>
      <circle cx="5" cy="27" r="2"/><circle cx="10.5" cy="27" r="2"/><circle cx="16" cy="27" r="2"/><circle cx="27" cy="27" r="2"/>
    </g>
    <g fill="#ffb000">
      <circle cx="21.5" cy="5" r="2"/><circle cx="16" cy="10.5" r="2"/><circle cx="10.5" cy="16" r="2"/><circle cx="16" cy="21.5" r="2"/><circle cx="21.5" cy="27" r="2"/>
    </g>
  </g>
</svg>
